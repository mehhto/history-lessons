name: Technical quality
on: [push, pull_request]
jobs:
  documentary-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v22
        with: { node-version: 22 }
      - run: npm ci
      - run: node --test
      - run: node scripts/check-lessons.mjs --allow-pending
      - run: node scripts/check-slide-composition.mjs --lesson classes/8/wojna-obronna-polski-we-wrzesniu-1939-roku
      - run: node scripts/check-slide-composition.mjs --lesson classes/6/skutki-wypraw-geograficznych-i-ameryka-przed-kolumbem
