<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Narodziny i wczesne rozprzestrzenianie się chrześcijaństwa</title>
  <desc id="desc">Schemat szlaków od Jerozolimy przez Antiochię, Efez i Korynt do Rzymu w pierwszych wiekach naszej ery.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#9b3e2c"/></marker></defs>
  <rect width="1600" height="900" fill="#f6f1e6"/>
  <text x="85" y="88" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#55411d">Od Judei ku miastom Morza Śródziemnego</text>
  <text x="86" y="132" font-family="Arial,sans-serif" font-size="27" fill="#706754">I–III w. n.e. • schemat kierunków, nie mapa granic</text>
  <path d="M90 310 Q310 175 560 240 Q770 300 910 230 Q1140 145 1510 275 L1510 690 Q1270 620 1060 690 Q820 760 620 665 Q390 570 90 660 Z" fill="#cfe3e6" stroke="#1f625b" stroke-width="5"/>
  <text x="760" y="495" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#1b7182">Morze Śródziemne</text>
  <path d="M90 310 Q330 190 570 250 L610 160 L90 160 Z" fill="#e8dfca"/>
  <path d="M1510 275 Q1210 180 975 250 L930 155 L1510 155 Z" fill="#e8dfca"/>
  <path d="M1510 690 Q1270 625 1060 700 L1090 835 L1510 835 Z" fill="#e8dfca"/>
  <path d="M90 660 Q360 565 620 675 L580 835 L90 835 Z" fill="#e8dfca"/>
  <g font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#213f3a">
    <circle cx="1300" cy="590" r="15" fill="#9b3e2c"/><text x="1324" y="600">Jerozolima</text>
    <circle cx="1195" cy="335" r="13" fill="#806419"/><text x="1218" y="345">Antiochia</text>
    <circle cx="940" cy="405" r="13" fill="#806419"/><text x="962" y="415">Efez</text>
    <circle cx="700" cy="515" r="13" fill="#806419"/><text x="722" y="525">Korynt</text>
    <circle cx="370" cy="340" r="13" fill="#806419"/><text x="392" y="350">Rzym</text>
  </g>
  <path d="M1285 575 Q1245 460 1205 350" fill="none" stroke="#9b3e2c" stroke-width="10" marker-end="url(#arrow)"/>
  <path d="M1180 345 Q1050 350 955 395" fill="none" stroke="#9b3e2c" stroke-width="10" marker-end="url(#arrow)"/>
  <path d="M920 420 Q815 455 720 505" fill="none" stroke="#9b3e2c" stroke-width="10" marker-end="url(#arrow)"/>
  <path d="M680 495 Q520 395 395 350" fill="none" stroke="#9b3e2c" stroke-width="10" marker-end="url(#arrow)"/>
  <rect x="85" y="735" width="1430" height="92" rx="18" fill="#fffdf7" stroke="#d9c99b" stroke-width="3"/>
  <text x="120" y="778" font-family="Arial,sans-serif" font-size="27" fill="#30291f">Chrześcijaństwo narodziło się w środowisku żydowskim w rzymskiej Judei.</text>
  <text x="120" y="813" font-family="Arial,sans-serif" font-size="25" fill="#52615c">Rozchodziło się przez miasta, porty i drogi cesarstwa rzymskiego.</text>
</svg>
