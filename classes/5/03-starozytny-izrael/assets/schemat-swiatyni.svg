<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Świątynia Jerozolimska — funkcja i chronologia</title>
  <desc id="desc">Autorski schemat pokazujący dziedziniec, Miejsce Święte i Miejsce Najświętsze oraz daty Pierwszej i Drugiej Świątyni.</desc>
  <rect width="1600" height="900" fill="#f6f1e6"/>
  <text x="90" y="92" font-family="Arial,sans-serif" font-size="58" font-weight="700" fill="#55411d">Świątynia Jerozolimska</text>
  <text x="92" y="140" font-family="Arial,sans-serif" font-size="28" fill="#706754">centrum kultu i miejsce składania ofiar</text>
  <rect x="90" y="200" width="880" height="480" rx="28" fill="#fffdf7" stroke="#92722b" stroke-width="6"/>
  <text x="130" y="258" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#55411d">Dziedziniec i przestrzeń kompleksu</text>
  <rect x="250" y="320" width="590" height="270" rx="16" fill="#e8dfca" stroke="#806419" stroke-width="5"/>
  <text x="285" y="375" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#213f3a">Miejsce Święte</text>
  <text x="285" y="425" font-family="Arial,sans-serif" font-size="26" fill="#30291f">modlitwa i obrzędy kapłanów</text>
  <rect x="605" y="355" width="185" height="180" rx="12" fill="#9b3e2c"/>
  <text x="697" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">Miejsce</text>
  <text x="697" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">Najświętsze</text>
  <text x="697" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#fff">Arka Przymierza</text>
  <path d="M120 760 H1480" stroke="#706c58" stroke-width="7"/>
  <circle cx="250" cy="760" r="17" fill="#92722b"/><circle cx="600" cy="760" r="17" fill="#92722b"/><circle cx="920" cy="760" r="17" fill="#92722b"/><circle cx="1280" cy="760" r="17" fill="#9b3e2c"/>
  <text x="250" y="725" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#55411d">X w. p.n.e.</text>
  <text x="250" y="810" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#30291f">Pierwsza Świątynia</text>
  <text x="600" y="725" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#55411d">587/586 p.n.e.</text>
  <text x="600" y="810" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#30291f">zniszczenie przez Babilończyków</text>
  <text x="920" y="725" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#55411d">ok. 516 p.n.e.</text>
  <text x="920" y="810" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#30291f">Druga Świątynia</text>
  <text x="1280" y="725" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#55411d">70 n.e.</text>
  <text x="1280" y="810" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#30291f">zniszczenie przez Rzymian</text>
  <text x="1510" y="875" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#706754">schemat funkcji — nie rekonstrukcja wyglądu budowli</text>
</svg>
