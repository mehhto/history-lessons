<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Podział ziem Księstwa Warszawskiego po kongresie wiedeńskim</title>
<desc id="desc">Schemat pokazuje przejście od Księstwa Warszawskiego do Królestwa Polskiego, Wielkiego Księstwa Poznańskiego, Rzeczypospolitej Krakowskiej i ziem przyznanych Austrii.</desc>
<rect width="1280" height="720" fill="#f8f3ec"/>
<text x="640" y="62" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="700" fill="#40202a">Co stało się z Księstwem Warszawskim?</text>
<rect x="420" y="96" width="440" height="105" rx="8" fill="#40202a"/>
<text x="640" y="138" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#fff">KSIĘSTWO WARSZAWSKIE</text>
<text x="640" y="166" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#f8ebe2">utworzone przez Napoleona</text>
<text x="640" y="190" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#f8ebe2">zlikwidowane w 1815 r.</text>
<path d="M640 201V258M640 238H160V290M640 238H470V290M640 238H810V290M640 238H1120V290" fill="none" stroke="#866a57" stroke-width="5"/>
<g font-family="DejaVu Sans, sans-serif">
<g><rect x="42" y="290" width="236" height="270" rx="8" fill="#e4d3c3" stroke="#7b3f4d" stroke-width="3"/><text x="160" y="338" text-anchor="middle" font-size="22" font-weight="700" fill="#40202a">KRÓLESTWO</text><text x="160" y="368" text-anchor="middle" font-size="22" font-weight="700" fill="#40202a">POLSKIE</text><text x="160" y="410" text-anchor="middle" font-size="18" fill="#25222a">większość ziem</text><text x="160" y="442" text-anchor="middle" font-size="18" fill="#25222a">unia personalna</text><text x="160" y="474" text-anchor="middle" font-size="18" fill="#25222a">z Rosją</text><text x="160" y="523" text-anchor="middle" font-size="19" font-weight="700" fill="#7b3f4d">władca: Aleksander I</text></g>
<g><rect x="352" y="290" width="236" height="270" rx="8" fill="#d9dfe6" stroke="#35546d" stroke-width="3"/><text x="470" y="338" text-anchor="middle" font-size="21" font-weight="700" fill="#263b4c">WIELKIE KSIĘSTWO</text><text x="470" y="368" text-anchor="middle" font-size="21" font-weight="700" fill="#263b4c">POZNAŃSKIE</text><text x="470" y="410" text-anchor="middle" font-size="18" fill="#25222a">zachodnia część</text><text x="470" y="442" text-anchor="middle" font-size="18" fill="#25222a">z Poznaniem</text><text x="470" y="490" text-anchor="middle" font-size="19" font-weight="700" fill="#35546d">pod władzą Prus</text></g>
<g><rect x="692" y="290" width="236" height="270" rx="8" fill="#eadfb9" stroke="#8b6f16" stroke-width="3"/><text x="810" y="338" text-anchor="middle" font-size="20" font-weight="700" fill="#59490e">RZECZPOSPOLITA</text><text x="810" y="368" text-anchor="middle" font-size="20" font-weight="700" fill="#59490e">KRAKOWSKA</text><text x="810" y="410" text-anchor="middle" font-size="18" fill="#25222a">Kraków i okolice</text><text x="810" y="450" text-anchor="middle" font-size="18" fill="#25222a">wolne miasto pod</text><text x="810" y="480" text-anchor="middle" font-size="18" fill="#25222a">protektoratem trzech</text><text x="810" y="510" text-anchor="middle" font-size="18" fill="#25222a">państw zaborczych</text></g>
<g><rect x="1002" y="290" width="236" height="270" rx="8" fill="#d9e3d4" stroke="#4e6c45" stroke-width="3"/><text x="1120" y="338" text-anchor="middle" font-size="22" font-weight="700" fill="#34492f">AUSTRIA</text><text x="1120" y="390" text-anchor="middle" font-size="18" fill="#25222a">odzyskała ziemie</text><text x="1120" y="422" text-anchor="middle" font-size="18" fill="#25222a">zabrane jej przez</text><text x="1120" y="454" text-anchor="middle" font-size="18" fill="#25222a">Księstwo w 1809 r.</text><text x="1120" y="505" text-anchor="middle" font-size="19" font-weight="700" fill="#4e6c45">utrzymała Galicję</text></g>
</g>
<path d="M70 626H1210" stroke="#b9a997" stroke-width="2"/>
<text x="640" y="667" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#40202a">Nie odbudowano niepodległej Polski — mocarstwa podzieliły ziemie według własnych interesów.</text>
</svg>
