<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">Batory: od walki o porty do odzyskania Inflant</title>
<desc id="desc">Car chce portów nad Bałtykiem. Batory: wybór 1575, koronacja 1576. Połock zdobyty w 1579, Wielkie Łuki zdobyte w 1580, Psków oblegany w 1581–1582, ale niezdobyty. Jam Zapolski 1582: odzyskane Inflanty i Połock.</desc>
