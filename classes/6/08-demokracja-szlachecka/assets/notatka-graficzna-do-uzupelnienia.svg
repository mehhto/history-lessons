<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="794" viewBox="0 0 1122 794" role="img" aria-labelledby="title desc"><title id="title">Demokracja szlachecka — notatka graficzna</title><desc id="desc">Pochodzenie szlachty, jej cztery warstwy, prawa i obowiązki, konstytucja Nihil novi oraz droga decyzji od sejmiku do sejmu.</desc><rect width="1122" height="794" fill="#FFFFFF"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="24" y="20" width="1074" height="754" rx="8" fill="none" stroke="#7B3294" stroke-width="4"/><text x="56" y="82" font-size="44" font-weight="700" fill="#7B3294" text-anchor="start">DEMOKRACJA SZLACHECKA</text><text x="57" y="123" font-size="25" font-weight="500" fill="#1F2933" text-anchor="start">Kto mógł decydować o sprawach państwa?</text><path d="M56 144 L1064 144" stroke="#008837" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="45" y="169" width="355" height="204" rx="8" fill="#F7F7F7" stroke="#008837" stroke-width="2"/><text x="62" y="205" font-size="18" font-weight="700" fill="#008837" text-anchor="start">SKĄD SIĘ WZIĘŁA SZLACHTA?</text><text x="64" y="246" font-size="26" font-weight="700" fill="#1F2933" text-anchor="start">________</text><path d="M212 236 L250 236" stroke="#7B3294" stroke-width="4" fill="none" stroke-linecap="round"/><text x="263" y="246" font-size="26" font-weight="700" fill="#1F2933" text-anchor="start">_______</text><text x="64" y="286" font-size="21" font-weight="400" fill="#1F2933" text-anchor="start">Jeden stan, różne majątki.</text><text x="64" y="334" font-size="23" font-weight="700" fill="#7B3294" text-anchor="start">ok. ______ społeczeństwa*</text><rect x="416" y="169" width="661" height="204" rx="8" fill="#F7F7F7" stroke="#008837" stroke-width="2"/><text x="436" y="205" font-size="21" font-weight="700" fill="#008837" text-anchor="start">CZTERY WARSTWY SZLACHTY · JEDEN STAN</text><rect x="433" y="224" width="151" height="128" rx="8" fill="white" stroke="#7B3294" stroke-width="2"/><text x="508" y="262" font-size="20" font-weight="700" fill="#1F2933" text-anchor="middle">Magnateria</text><text x="508" y="292" font-size="15" font-weight="400" fill="#1F2933" text-anchor="middle">____________</text><rect x="592" y="224" width="151" height="128" rx="8" fill="white" stroke="#7B3294" stroke-width="2"/><text x="667" y="262" font-size="20" font-weight="700" fill="#1F2933" text-anchor="middle">Średnia</text><text x="667" y="292" font-size="15" font-weight="400" fill="#1F2933" text-anchor="middle">własna _______</text><rect x="751" y="224" width="151" height="128" rx="8" fill="white" stroke="#7B3294" stroke-width="2"/><text x="826" y="262" font-size="20" font-weight="700" fill="#1F2933" text-anchor="middle">Zagrodowa</text><text x="826" y="292" font-size="15" font-weight="400" fill="#1F2933" text-anchor="middle">mała ________</text><rect x="910" y="224" width="151" height="128" rx="8" fill="white" stroke="#7B3294" stroke-width="2"/><text x="985" y="262" font-size="20" font-weight="700" fill="#1F2933" text-anchor="middle">Gołota</text><text x="985" y="292" font-size="15" font-weight="400" fill="#1F2933" text-anchor="middle">bez __________</text><rect x="45" y="389" width="512" height="190" rx="8" fill="#F7F7F7" stroke="#008837" stroke-width="2"/><text x="63" y="425" font-size="24" font-weight="700" fill="#008837" text-anchor="start">PRAWA I OBOWIĄZKI</text><text x="66" y="467" font-size="22" font-weight="700" fill="#1F2933" text-anchor="start">PRZYWILEJE = _______________</text><text x="66" y="503" font-size="19" font-weight="400" fill="#1F2933" text-anchor="start">Sejmiki → wybór ________ → prawo</text><text x="66" y="543" font-size="19" font-weight="400" fill="#1F2933" text-anchor="start">Obrona kraju · ______________</text><rect x="580" y="389" width="497" height="190" rx="8" fill="#F7F7F7" stroke="#7B3294" stroke-width="2"/><text x="601" y="430" font-size="29" font-weight="700" fill="#7B3294" text-anchor="start">1505 · NIHIL NOVI</text><text x="601" y="468" font-size="20" font-weight="400" fill="#1F2933" text-anchor="start">Nowe prawa wymagały zgody ______:</text><text x="601" y="505" font-size="20" font-weight="700" fill="#1F2933" text-anchor="start">króla, _______ i izby poselskiej.</text><text x="601" y="544" font-size="18" font-weight="400" fill="#1F2933" text-anchor="start">Nie znaczyło to: „król nic nie mógł”.</text><rect x="45" y="594" width="1032" height="148" rx="8" fill="#F7F7F7" stroke="#008837" stroke-width="2"/><text x="63" y="630" font-size="23" font-weight="700" fill="#008837" text-anchor="start">JAK SZLACHTA UCZESTNICZYŁA W DECYZJI?</text><rect x="60" y="650" width="228" height="72" rx="8" fill="white" stroke="#7B3294" stroke-width="2"/><text x="174" y="680" font-size="19" font-weight="700" fill="#1F2933" text-anchor="middle">SEJMIK</text><text x="174" y="707" font-size="15" font-weight="400" fill="#1F2933" text-anchor="middle">lokalna _______</text><text x="300" y="693" font-size="37" font-weight="700" fill="#7B3294" text-anchor="middle">›</text><rect x="312" y="650" width="228" height="72" rx="8" fill="white" stroke="#7B3294" stroke-width="2"/><text x="426" y="680" font-size="19" font-weight="700" fill="#1F2933" text-anchor="middle">POSEŁ</text><text x="426" y="707" font-size="15" font-weight="400" fill="#1F2933" text-anchor="middle">wybrany przez sejmik</text><text x="552" y="693" font-size="37" font-weight="700" fill="#7B3294" text-anchor="middle">›</text><rect x="564" y="650" width="228" height="72" rx="8" fill="white" stroke="#7B3294" stroke-width="2"/><text x="678" y="680" font-size="19" font-weight="700" fill="#1F2933" text-anchor="middle">IZBA POSELSKA</text><text x="678" y="707" font-size="15" font-weight="400" fill="#1F2933" text-anchor="middle">obrady posłów</text><text x="804" y="693" font-size="37" font-weight="700" fill="#7B3294" text-anchor="middle">›</text><rect x="816" y="650" width="228" height="72" rx="8" fill="white" stroke="#7B3294" stroke-width="2"/><text x="930" y="680" font-size="19" font-weight="700" fill="#1F2933" text-anchor="middle">SEJM WALNY</text><text x="930" y="707" font-size="15" font-weight="400" fill="#1F2933" text-anchor="middle">król + senat + posłowie</text><text x="60" y="763" font-size="14" font-weight="400" fill="#1F2933" text-anchor="start">* Udział szlachty był różny w czasie i w poszczególnych ziemiach. Większość mieszkańców nie miała praw politycznych.</text></g></svg>
