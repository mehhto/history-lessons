<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lekcje historii</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/admin/app.css">
</head>
<body>
  <header>
    <h1>Lekcje historii</h1>
    <button id="refresh">Odśwież katalog</button>
  </header>
  <main>
    <aside>
      <div class="catalog-switch" role="tablist" aria-label="Rodzaj materiału">
        <button id="show-lessons" role="tab" aria-selected="true" aria-controls="catalog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></svg>
          <span>Lekcje</span>
        </button>
        <button id="show-tests" role="tab" aria-selected="false" aria-controls="catalog" tabindex="-1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/></svg>
          <span>Kartkówki</span>
        </button>
      </div>
      <label>Szukaj <input id="filter" type="search" placeholder="Tytuł materiału"></label>
      <div id="grade-filters" aria-label="Filtr klas"></div>
      <div id="catalog" role="tabpanel" aria-labelledby="show-lessons" tabindex="0"></div>
    </aside>
    <section id="workspace"><p class="empty">Wybierz materiał z katalogu.</p></section>
  </main>
  <dialog id="feedback-modal" aria-labelledby="feedback-title">
    <form id="feedback-form">
      <h2 id="feedback-title">Refleksja po lekcji</h2>
      <p id="feedback-lesson"></p>
      <label for="reflection-understood">Co uczniowie zrozumieli?</label>
      <textarea id="reflection-understood" maxlength="1000" placeholder="Najważniejsze obserwacje."></textarea>
      <label for="reflection-unclear">Co było niejasne?</label>
      <textarea id="reflection-unclear" maxlength="1000" placeholder="Pojęcia, instrukcje lub trudności."></textarea>
      <label for="reflection-timing">Jak wyglądał czas lekcji?</label>
      <textarea id="reflection-timing" maxlength="1000" placeholder="Co wymagało skrócenia lub więcej czasu."></textarea>
      <label for="reflection-next-change">Co zmienić przed kolejnym użyciem?</label>
      <textarea id="reflection-next-change" maxlength="1000" placeholder="Jedna konkretna poprawka."></textarea>
      <p id="feedback-error" role="alert"></p>
      <div class="dialog-actions">
        <button id="feedback-cancel" type="button">Anuluj</button>
        <button type="submit">Zapisz refleksję</button>
      </div>
    </form>
  </dialog>
  <div id="status" aria-live="polite"></div>
  <script type="module" src="/admin/app.js"></script>
</body>
</html>
