<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lekcje historii</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/admin/app.css">
</head>
<body>
  <header>
    <h1>Lekcje historii</h1>
    <button id="refresh">Odśwież katalog</button>
  </header>
  <main>
    <aside>
      <div class="catalog-switch" role="tablist" aria-label="Rodzaj materiału">
        <button id="show-lessons" role="tab" aria-selected="true">Lekcje</button>
        <button id="show-tests" role="tab" aria-selected="false">Kartkówki</button>
      </div>
      <label>Szukaj <input id="filter" type="search" placeholder="Tytuł materiału"></label>
      <div id="grade-filters" aria-label="Filtr klas"></div>
      <div id="catalog"></div>
    </aside>
    <section id="workspace"><p class="empty">Wybierz materiał z katalogu.</p></section>
  </main>
  <dialog id="feedback-modal" aria-labelledby="feedback-title">
    <form id="feedback-form">
      <h2 id="feedback-title">Feedback do lekcji</h2>
      <p id="feedback-lesson"></p>
      <label for="feedback-text">Co zadziałało dobrze? Co wymaga poprawy?</label>
      <textarea id="feedback-text" name="feedback" maxlength="4000" required placeholder="Np. zadanie z mapą było angażujące, ale instrukcja wymagała doprecyzowania."></textarea>
      <p id="feedback-error" role="alert"></p>
      <div class="dialog-actions">
        <button id="feedback-cancel" type="button">Anuluj</button>
        <button type="submit">Zapisz feedback</button>
      </div>
    </form>
  </dialog>
  <div id="status" aria-live="polite"></div>
  <script type="module" src="/admin/app.js"></script>
</body>
</html>
